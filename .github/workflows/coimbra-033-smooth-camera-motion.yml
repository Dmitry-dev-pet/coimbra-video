name: Coimbra 033 smooth camera-motion review contract

on:
  pull_request:
    paths:
      - blender/render_camera_motion_review.py
      - scripts/verify_camera_motion_review.py
      - scripts/test_camera_motion_review.py
      - docs/specs/SPEC-COIMBRA-SMOOTH-CAMERA-MOTION-1.md
      - .github/workflows/coimbra-033-smooth-camera-motion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile 033 scripts
        run: |
          python -m compileall -q \
            blender/render_camera_motion_review.py \
            scripts/verify_camera_motion_review.py \
            scripts/test_camera_motion_review.py
      - name: Run Blender-free 033 verifier tests
        run: python -m unittest discover -s scripts -p 'test_camera_motion_review.py' -v
