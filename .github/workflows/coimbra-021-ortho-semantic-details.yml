name: Coimbra orthophoto semantic details 021

on:
  push:
    branches:
      - feature/coimbra-021-ortho-semantic-details
    paths:
      - "scripts/detect_semantic_details_ortho.py"
      - "blender/extract_packed_ortho.py"
      - "blender/build_semantic_details.py"
      - "scripts/verify_semantic_details.py"
      - "docs/specs/SPEC-COIMBRA-ORTHO-SEMANTIC-DETAILS-1.md"
      - ".github/workflows/coimbra-021-ortho-semantic-details.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_CACHE: "/home/runner/.cache/blender-5.2.2"
  OEM_REF: "8b301688b870f0eb8a5b93337ca3bc90a28734c4"
  HIGHRES_008B_RUN_ID: "36491512430"
  ROOF_019_RUN_ID: "36589306803"

jobs:
  semantic-details:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Download accepted 019 corrected-roof scene
        uses: actions/download-artifact@v4
        with:
          name: coimbra-019-pitched-roofs-prepared
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ROOF_019_RUN_ID }}
          path: bridge_output_019_download

      - name: Normalize 019 source scene
        run: |
          set -euo pipefail
          mkdir -p bridge_output_019
          found="$(find bridge_output_019_download -type f -name 'coimbra-full-route-pitched-roofs.blend' -print -quit)"
          test -n "$found"
          cp "$found" bridge_output_019/coimbra-full-route-pitched-roofs.blend
          test -s bridge_output_019/coimbra-full-route-pitched-roofs.blend

      - name: Download DGT high-resolution terrain and HAG
        uses: actions/download-artifact@v4
        with:
          name: coimbra-008b-highres-geodata
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HIGHRES_008B_RUN_ID }}
          path: bridge_output_008b_download

      - name: Normalize high-resolution grids
        run: |
          set -euo pipefail
          mkdir -p bridge_output_008b
          hag="$(find bridge_output_008b_download -type f -name 'bridge_height_above_ground_1m.npz' -print -quit)"
          terrain="$(find bridge_output_008b_download -type f -name 'bridge_terrain_highres_2m.npz' -print -quit)"
          test -n "$hag"
          test -n "$terrain"
          cp "$hag" bridge_output_008b/bridge_height_above_ground_1m.npz
          cp "$terrain" bridge_output_008b/bridge_terrain_highres_2m.npz
          test -s bridge_output_008b/bridge_height_above_ground_1m.npz
          test -s bridge_output_008b/bridge_terrain_highres_2m.npz

      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/blender-5.2.2
          key: blender-linux-x64-5.2.2

      - name: Install Blender
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_CACHE"
          if [ ! -x "$BLENDER_CACHE/blender" ]; then
            archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender5.2"
            curl --fail --location --retry 4 --output "/tmp/$archive" "$base/$archive"
            tar -xJf "/tmp/$archive" -C "$BLENDER_CACHE" --strip-components=1
          fi
          echo "$BLENDER_CACHE" >> "$GITHUB_PATH"

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libegl1 libgl1 libx11-6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0

      - name: Extract the already packed DGT orthophoto
        run: |
          set -euo pipefail
          blender --background --factory-startup --python-exit-code 1             --python blender/extract_packed_ortho.py
          test -s data/processed/bridge_ortho_2025.jpg
          test -s data/processed/bridge_ortho_2025.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout pinned OpenEarthMap lightweight model
        uses: actions/checkout@v4
        with:
          repository: cliffbb/oem-lightweight
          ref: ${{ env.OEM_REF }}
          path: OEM-LightweightModel

      - name: Install CPU semantic-inference dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install             --index-url https://download.pytorch.org/whl/cpu             "torch==2.2.2" "torchvision==0.17.2"
          python -m pip install             "numpy==1.26.4"             "Pillow>=11,<13"             "opencv-python-headless>=4.10,<5"             "scipy>=1.13,<2"             "scikit-image>=0.24,<1"             "easydict>=1.13,<2"             "gdown>=5.2,<6"

      - name: Download pinned OpenEarthMap FasterSeg weights
        run: |
          set -euo pipefail
          mkdir -p OEM-LightweightModel/models/FasterSeg
          gdown "https://drive.google.com/uc?id=12oDzi-sDnD_Y4CBONei_g2SZBMZ6cx-2"             -O OEM-LightweightModel/models/FasterSeg/arch_1.pt
          gdown "https://drive.google.com/uc?id=1BgCu1Rz2PvTPJzI_J97hNkr4HvlvI-pE"             -O OEM-LightweightModel/models/FasterSeg/weights1.pt
          test -s OEM-LightweightModel/models/FasterSeg/arch_1.pt
          test -s OEM-LightweightModel/models/FasterSeg/weights1.pt

      - name: Segment trees and water with OpenEarthMap FasterSeg
        run: |
          set -euo pipefail
          python scripts/detect_semantic_details_ortho.py             --oem-root OEM-LightweightModel             --arch OEM-LightweightModel/models/FasterSeg/arch_1.pt             --weights OEM-LightweightModel/models/FasterSeg/weights1.pt
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("data/processed/bridge_semantic_details_2025.json").read_text())
          print(json.dumps(data["counts"], indent=2))
          PY

      - name: Build semantic tree and pool detail image
        run: |
          set -euo pipefail
          rm -rf bridge_output_021
          blender --background --factory-startup --python-exit-code 1             --python blender/build_semantic_details.py
          test -s bridge_output_021/semantic-details.png
          cat bridge_output_021/semantic-details-internal.json

      - name: Verify semantic detail pass
        run: |
          python scripts/verify_semantic_details.py             data/processed/bridge_semantic_details_2025.json             bridge_output_021/semantic-details-internal.json

      - name: Upload only the review image
        uses: actions/upload-artifact@v4
        with:
          name: coimbra-021-semantic-detail-image
          path: bridge_output_021/semantic-details.png
          if-no-files-found: error
          compression-level: 1
