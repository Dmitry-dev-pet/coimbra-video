name: Coimbra 028 Metal full-route contract

on:
  pull_request:
    paths:
      - blender/render_cycles_metal_full_route.py
      - scripts/verify_cycles_metal_full_route.py
      - scripts/test_cycles_metal_full_route.py
      - docs/specs/SPEC-COIMBRA-METAL-FULL-ROUTE-1.md
      - .github/workflows/coimbra-028-metal-full-route.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile 028 scripts
        run: |
          python -m compileall -q             blender/render_cycles_metal_full_route.py             scripts/verify_cycles_metal_full_route.py             scripts/test_cycles_metal_full_route.py
      - name: Run Blender-free acceptance tests
        run: python -m unittest discover -s scripts -p 'test_cycles_metal_full_route.py' -v
