name: Coimbra 036 quality64 full-route contract

on:
  pull_request:
    paths:
      - blender/render_production_look_slow60_quality64_metal.py
      - scripts/verify_production_look_slow60_quality64_metal.py
      - scripts/test_production_look_slow60_quality64_metal.py
      - docs/specs/SPEC-COIMBRA-QUALITY64-FULL-ROUTE-1.md
      - .github/workflows/coimbra-036-quality64-full-route.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile 036 scripts
        run: |
          python -m compileall -q \
            blender/render_production_look_slow60_quality64_metal.py \
            scripts/verify_production_look_slow60_quality64_metal.py \
            scripts/test_production_look_slow60_quality64_metal.py
      - name: Run Blender-free 036 acceptance tests
        run: python -m unittest discover -s scripts -p 'test_production_look_slow60_quality64_metal.py' -v
