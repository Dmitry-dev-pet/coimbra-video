name: Coimbra post-merge Mac readiness (no dispatch)

on:
  workflow_run:
    workflows: ['Mac runtime package']
    types: [completed]

permissions:
  contents: read

jobs:
  postmerge:
    if: >-
      github.repository == 'Dmitry-dev-pet/coimbra-video' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed verifier from default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify merge provenance and protected main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_mac_postmerge_gate.py
      - name: Publish readiness receipt even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-postmerge-readiness
          path: postmerge-mac-candidate.json
          if-no-files-found: error
          retention-days: 14
