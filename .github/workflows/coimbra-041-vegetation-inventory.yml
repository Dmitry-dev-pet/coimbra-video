name: Coimbra 041 Polo II vegetation source inventory

on:
  push:
    branches:
      - feature/coimbra-041-polo-ii-vegetation-ab
    paths:
      - "scripts/coimbra_041_source_inventory.mjs"
      - ".github/workflows/coimbra-041-vegetation-inventory.yml"
  pull_request:
    branches:
      - feature/coimbra-040-polo-ii-visual-ab
    paths:
      - "scripts/coimbra_041_source_inventory.mjs"
      - ".github/workflows/coimbra-041-vegetation-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Restore SHA-256-verified public Coimbra GLB and OSM tiles
        run: python scripts/prepare_coimbra_039_preview.py
      - name: Build existing verified browser scene
        working-directory: web
        run: npm run build
      - name: Install browser test harness
        working-directory: web
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Inspect vegetation source topology and spatial components
        working-directory: web
        run: |
          set -euo pipefail
          cp ../scripts/coimbra_041_source_inventory.mjs tests/coimbra-041-source-inventory.mjs
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/coimbra-041-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/037/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/037/ >/dev/null
          node tests/coimbra-041-source-inventory.mjs
      - name: Publish inspection metadata (no large GLB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coimbra-041-vegetation-inventory
          path: web/polo-ii-041-evidence/*.json
          if-no-files-found: warn
          retention-days: 2
