name: Coimbra DGT terrain slow flight 003

on:
  push:
    branches: [main]
    paths:
      - "contracts/COIMBRA-BRIDGE-003-SLOW.json"
      - "docs/specs/SPEC-COIMBRA-BLENDER-1.md"
      - "scripts/apatch_blender_governance.py"
      - "scripts/verify_apatch_blender_evidence.py"
      - "verification/COIMBRA-BRIDGE-003-SLOW.probe"
      - ".github/workflows/coimbra-apatch-blender-003-slow.yml"
      - "data/processed/bridge_terrain_6m.npz"
      - "data/processed/bridge_terrain_6m.json"
      - "scripts/prepare_osm_local_for_terrain.py"
      - "blender/build_dgt_terrain_scene.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_CACHE: "/home/runner/.cache/blender-5.2.2"
  BRIDGE_REF: "dfba2d8c9249188dab75eccdfebe2e6dbec30f03"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout APatch Blender
        uses: actions/checkout@v4
        with:
          repository: Dmitry-dev-pet/apatch-blender
          ref: ${{ env.BRIDGE_REF }}
          path: _bridge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install geodata and APatch governance dependencies
        run: |
          python -m pip install \
            "requests>=2.32,<3" "numpy>=2,<3" "pyproj>=3.7,<4" "Pillow>=11,<12" \
            "apatch>=0.8.48,<0.9"

      - name: Prepare public inputs around pinned DGT terrain
        run: |
          set -euo pipefail
          test -s data/processed/bridge_terrain_6m.npz
          test -s data/processed/bridge_terrain_6m.json
          python scripts/fetch_osm_bridge.py
          python scripts/fetch_dgt_ortho_bridge.py
          python scripts/prepare_osm_local_for_terrain.py

      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/blender-5.2.2
          key: blender-linux-x64-5.2.2

      - name: Install Blender
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_CACHE"
          if [ ! -x "$BLENDER_CACHE/blender" ]; then
            archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender5.2"
            curl --fail --location --retry 4 --output "/tmp/$archive" "$base/$archive"
            tar -xJf "/tmp/$archive" -C "$BLENDER_CACHE" --strip-components=1
          fi
          echo "$BLENDER_CACHE" >> "$GITHUB_PATH"

      - name: Install Blender runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0

      - name: Build terrain base
        run: |
          rm -rf bridge_output_003
          blender --background --factory-startup --python-exit-code 1 \
            --python blender/build_dgt_terrain_scene.py

      - name: Start governed APatch SDD session
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/_bridge/src" \
            python scripts/apatch_blender_governance.py \
              --root "$GITHUB_WORKSPACE" start \
              --contract contracts/COIMBRA-BRIDGE-003-SLOW.json \
              --baseline data/processed/bridge_terrain_6m.npz

      - name: Install APatch into Blender Python
        run: |
          set -euo pipefail
          BLENDER_PYTHON="$(find "$BLENDER_CACHE" -type f -path '*/python/bin/python3.*' -perm -111 | head -n 1)"
          test -n "$BLENDER_PYTHON"
          "$BLENDER_PYTHON" -m ensurepip --upgrade
          "$BLENDER_PYTHON" -m pip install "apatch>=0.8.48,<0.9"

      - name: Execute slow-flight contract
        run: |
          blender --background --factory-startup --python-exit-code 1 \
            --python _bridge/scripts/execute_contract.py -- \
            --contract "$GITHUB_WORKSPACE/contracts/COIMBRA-BRIDGE-003-SLOW.json" \
            --root "$GITHUB_WORKSPACE"

      - name: Preserve APatch governed session state
        run: |
          cp -a .apatch bridge_output_003/apatch-state

      - name: Upload prepared slow scene
        uses: actions/upload-artifact@v4
        with:
          name: coimbra-003-slow-prepared
          path: |
            bridge_output_003/coimbra-terrain-base.blend
            bridge_output_003/coimbra-terrain-slow-edited.blend
            bridge_output_003/base-manifest.json
            bridge_output_003/slow-execution.json
            bridge_output_003/slow-preview.png
            bridge_output_003/apatch-session-start.json
            bridge_output_003/apatch-state/
          if-no-files-found: error

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: "01", start: 1, end: 30 }
          - { shard: "02", start: 31, end: 60 }
          - { shard: "03", start: 61, end: 90 }
          - { shard: "04", start: 91, end: 120 }
          - { shard: "05", start: 121, end: 150 }
          - { shard: "06", start: 151, end: 180 }
          - { shard: "07", start: 181, end: 210 }
          - { shard: "08", start: 211, end: 240 }
          - { shard: "09", start: 241, end: 270 }
          - { shard: "10", start: 271, end: 300 }
          - { shard: "11", start: 301, end: 330 }
          - { shard: "12", start: 331, end: 360 }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/blender-5.2.2
          key: blender-linux-x64-5.2.2

      - name: Install Blender
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_CACHE"
          if [ ! -x "$BLENDER_CACHE/blender" ]; then
            archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender5.2"
            curl --fail --location --retry 4 --output "/tmp/$archive" "$base/$archive"
            tar -xJf "/tmp/$archive" -C "$BLENDER_CACHE" --strip-components=1
          fi
          echo "$BLENDER_CACHE" >> "$GITHUB_PATH"

      - name: Install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0

      - uses: actions/download-artifact@v4
        with:
          name: coimbra-003-slow-prepared
          path: bridge_output_003

      - name: Render slow shard
        env:
          START_FRAME: ${{ matrix.start }}
          END_FRAME: ${{ matrix.end }}
        run: |
          mkdir -p bridge_output_003/slow-frames
          blender bridge_output_003/coimbra-terrain-slow-edited.blend --background \
            -s "$START_FRAME" -e "$END_FRAME" \
            -o "$GITHUB_WORKSPACE/bridge_output_003/slow-frames/frame_" -F PNG --render-anim
          test "$(find bridge_output_003/slow-frames -name 'frame_*.png' | wc -l)" -eq $((END_FRAME-START_FRAME+1))

      - uses: actions/upload-artifact@v4
        with:
          name: coimbra-003-slow-frames-${{ matrix.shard }}
          path: bridge_output_003/slow-frames/
          if-no-files-found: error
          compression-level: 1

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout APatch Blender
        uses: actions/checkout@v4
        with:
          repository: Dmitry-dev-pet/apatch-blender
          ref: ${{ env.BRIDGE_REF }}
          path: _bridge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install APatch governance runtime
        run: python -m pip install "apatch>=0.8.48,<0.9"
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/blender-5.2.2
          key: blender-linux-x64-5.2.2

      - name: Install Blender
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_CACHE"
          if [ ! -x "$BLENDER_CACHE/blender" ]; then
            archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender5.2"
            curl --fail --location --retry 4 --output "/tmp/$archive" "$base/$archive"
            tar -xJf "/tmp/$archive" -C "$BLENDER_CACHE" --strip-components=1
          fi
          echo "$BLENDER_CACHE" >> "$GITHUB_PATH"

      - name: Install verifier deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0 ffmpeg fonts-dejavu-core

      - uses: actions/download-artifact@v4
        with:
          name: coimbra-003-slow-prepared
          path: bridge_output_003

      - uses: actions/download-artifact@v4
        with:
          pattern: coimbra-003-slow-frames-*
          path: bridge_output_003/slow-frames
          merge-multiple: true

      - name: Restore APatch governed session state
        run: |
          rm -rf .apatch
          cp -a bridge_output_003/apatch-state .apatch

      - name: Encode slow 12-second flight
        run: |
          test "$(find bridge_output_003/slow-frames -name 'frame_*.png' | wc -l)" -eq 360
          ffmpeg -y -framerate 30 -start_number 1 \
            -i bridge_output_003/slow-frames/frame_%04d.png \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Terrain/Ortho © DGT · Open data / CC BY 4.0   |   Map data © OpenStreetMap contributors · ODbL':fontcolor=white:fontsize=13:x=12:y=h-th-10:box=1:boxcolor=black@0.4:boxborderw=4" \
            -c:v libx264 -pix_fmt yuv420p -crf 19 -movflags +faststart \
            bridge_output_003/coimbra-terrain-slow.mp4

      - name: Verify slow-flight contract
        run: |
          blender --background --factory-startup --python-exit-code 1 \
            --python _bridge/scripts/verify_contract.py -- \
            --contract "$GITHUB_WORKSPACE/contracts/COIMBRA-BRIDGE-003-SLOW.json" \
            --root "$GITHUB_WORKSPACE"
          cat bridge_output_003/slow-verification.json

      - name: Run frozen APatch SDD verification
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/_bridge/src" \
            python scripts/apatch_blender_governance.py \
              --root "$GITHUB_WORKSPACE" verify
          cat bridge_output_003/apatch-sdd-verification.json

      - run: rm -rf bridge_output_003/slow-frames

      - name: Upload slow-flight evidence
        uses: actions/upload-artifact@v4
        with:
          name: coimbra-apatch-blender-003-slow-12s
          path: |
            bridge_output_003/coimbra-terrain-slow.mp4
            bridge_output_003/coimbra-terrain-slow-edited.blend
            bridge_output_003/slow-preview.png
            bridge_output_003/slow-execution.json
            bridge_output_003/slow-verification.json
            bridge_output_003/base-manifest.json
            bridge_output_003/apatch-session-start.json
            bridge_output_003/apatch-sdd-verification.json
          if-no-files-found: error
