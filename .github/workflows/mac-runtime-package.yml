name: Mac runtime package

on:
  pull_request:
    paths:
      - 'ops/mac/**'
      - 'tests/test_mac_*.py'
      - '.github/workflows/mac-runtime-package.yml'
  push:
    branches: [main]
    paths:
      - 'ops/mac/**'
      - 'tests/test_mac_*.py'
      - '.github/workflows/mac-runtime-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - run: python -m unittest discover -s tests -p 'test_mac_*.py' -v
