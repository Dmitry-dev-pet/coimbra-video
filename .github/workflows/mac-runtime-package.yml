name: Mac runtime package

# Unfiltered PR CI is required so a single stable check can be made mandatory.
# This workflow never runs code on a self-hosted Mac.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - run: python -m unittest discover -s tests -p 'test_mac_*.py' -v
