name: Coimbra 035 visual-polish review contract

on:
  pull_request:
    paths:
      - blender/render_visual_polish_review.py
      - scripts/verify_visual_polish_review.py
      - scripts/test_visual_polish_review.py
      - docs/specs/SPEC-COIMBRA-VISUAL-POLISH-1.md
      - .github/workflows/coimbra-035-visual-polish-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile 035 scripts
        run: |
          python -m compileall -q \
            blender/render_visual_polish_review.py \
            scripts/verify_visual_polish_review.py \
            scripts/test_visual_polish_review.py
      - name: Run Blender-free 035 verifier tests
        run: python -m unittest discover -s scripts -p 'test_visual_polish_review.py' -v
