name: Coimbra OSS MOSAIQ benchmark 009A

on:
  pull_request:
    paths:
      - "config/open_source_stack.json"
      - "docs/OPEN_SOURCE_STACK.md"
      - "scripts/prepare_osm_oss_local.py"
      - "blender/build_mosaiq_details_benchmark.py"
      - ".github/workflows/coimbra-009a-mosaiq.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_CACHE: "/home/runner/.cache/blender-5.2.2"
  MOSAIQ_REF: "f73d030aecd3289007472a887d78aae2e74b6ea0"
  BASE_RUN_ID: "36492230698"
  HIGHRES_RUN_ID: "36491512430"

jobs:
  mosaiq-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout MOSAIQ
        uses: actions/checkout@v4
        with:
          repository: TUMFTM/MOSAIQ-OpenStreetMap-to-Blender-Add-On
          ref: ${{ env.MOSAIQ_REF }}
          path: _mosaiq/mosaiq_osm_vr

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host geodata dependencies
        run: python -m pip install "requests>=2.32,<3" "pyproj>=3.7,<4"

      - name: Fetch Coimbra OSM and prepare local OSS data
        run: |
          python scripts/fetch_osm_bridge.py
          python scripts/prepare_osm_oss_local.py
          test -s data/processed/bridge_osm_oss_local.json

      - name: Download 008C highres base scene
        uses: actions/download-artifact@v4
        with:
          name: coimbra-008c-highres-terrain
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}
          path: bridge_output_008c_download

      - name: Normalize 008C scene
        run: |
          mkdir -p bridge_output_008c
          found="$(find bridge_output_008c_download -type f -name 'coimbra-highres-terrain-visual-dev.blend' -print -quit)"
          test -n "$found"
          cp "$found" bridge_output_008c/coimbra-highres-terrain-visual-dev.blend

      - name: Download 008B terrain grid
        uses: actions/download-artifact@v4
        with:
          name: coimbra-008b-highres-geodata
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HIGHRES_RUN_ID }}
          path: bridge_output_008b_download

      - name: Normalize terrain input
        run: |
          mkdir -p bridge_output_008b
          found="$(find bridge_output_008b_download -type f -name 'bridge_terrain_highres_2m.npz' -print -quit)"
          test -n "$found"
          cp "$found" bridge_output_008b/bridge_terrain_highres_2m.npz

      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/blender-5.2.2
          key: blender-linux-x64-5.2.2

      - name: Install Blender
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_CACHE"
          if [ ! -x "$BLENDER_CACHE/blender" ]; then
            archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender5.2"
            curl --fail --location --retry 4 --output "/tmp/$archive" "$base/$archive"
            tar -xJf "/tmp/$archive" -C "$BLENDER_CACHE" --strip-components=1
          fi
          echo "$BLENDER_CACHE" >> "$GITHUB_PATH"

      - name: Install Blender runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libegl1 libgl1 libx11-6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0

      - name: Build MOSAIQ detail benchmark and previews
        run: |
          rm -rf bridge_output_009a
          blender --background --factory-startup --python-exit-code 1             --python blender/build_mosaiq_details_benchmark.py
          cat bridge_output_009a/mosaiq-benchmark-manifest.json

      - name: Upload MOSAIQ benchmark
        uses: actions/upload-artifact@v4
        with:
          name: coimbra-009a-mosaiq-benchmark
          path: |
            bridge_output_009a/coimbra-mosaiq-benchmark.blend
            bridge_output_009a/preview-001.png
            bridge_output_009a/preview-181.png
            bridge_output_009a/preview-360.png
            bridge_output_009a/mosaiq-benchmark-manifest.json
            data/processed/bridge_osm_oss_local.json
          if-no-files-found: error
