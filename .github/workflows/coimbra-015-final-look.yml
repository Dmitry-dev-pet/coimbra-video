name: Coimbra final look 015

on:
  push:
    branches:
      - feature/coimbra-015-final-look
    paths:
      - "blender/render_final_look.py"
      - "blender/enhance_environment_realism.py"
      - "blender/enhance_hero_realism.py"
      - "blender/enhance_hero_buildings.py"
      - "scripts/grade_final_look.py"
      - "scripts/verify_final_look.py"
      - "docs/specs/SPEC-COIMBRA-FINAL-LOOK-1.md"
      - ".github/workflows/coimbra-015-final-look.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_CACHE: "/home/runner/.cache/blender-5.2.2"
  PHOTO_011_RUN_ID: "36545015151"
  HIGHRES_008B_RUN_ID: "36491512430"
  OSM_009A_RUN_ID: "36495771020"

jobs:
  final-look:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install grading dependencies
        run: python -m pip install "numpy>=2,<3" "Pillow>=11,<13"

      - name: Download pinned rich OSM semantics
        uses: actions/download-artifact@v4
        with:
          name: coimbra-009a-mosaiq-benchmark
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.OSM_009A_RUN_ID }}
          path: osm_009a_download

      - name: Normalize OSM semantics
        run: |
          set -euo pipefail
          mkdir -p data/processed
          found="$(find osm_009a_download -type f -name 'bridge_osm_oss_local.json' -print -quit)"
          test -n "$found"
          cp "$found" data/processed/bridge_osm_oss_local.json
          test -s data/processed/bridge_osm_oss_local.json

      - name: Download Polo II 011 photo patch
        uses: actions/download-artifact@v4
        with:
          name: coimbra-011-polo2-photo-patch
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PHOTO_011_RUN_ID }}
          path: bridge_output_011_download

      - name: Normalize 011 patch blend
        run: |
          set -euo pipefail
          mkdir -p bridge_output_011
          found="$(find bridge_output_011_download -type f -name 'coimbra-polo2-photo-patch.blend' -print -quit)"
          test -n "$found"
          cp "$found" bridge_output_011/coimbra-polo2-photo-patch.blend
          test -s bridge_output_011/coimbra-polo2-photo-patch.blend

      - name: Download high-resolution terrain
        uses: actions/download-artifact@v4
        with:
          name: coimbra-008b-highres-geodata
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HIGHRES_008B_RUN_ID }}
          path: bridge_output_008b_download

      - name: Normalize terrain
        run: |
          set -euo pipefail
          mkdir -p bridge_output_008b
          found="$(find bridge_output_008b_download -type f -name 'bridge_terrain_highres_2m.npz' -print -quit)"
          test -n "$found"
          cp "$found" bridge_output_008b/bridge_terrain_highres_2m.npz
          test -s bridge_output_008b/bridge_terrain_highres_2m.npz

      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/blender-5.2.2
          key: blender-linux-x64-5.2.2

      - name: Install Blender
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_CACHE"
          if [ ! -x "$BLENDER_CACHE/blender" ]; then
            archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender5.2"
            curl --fail --location --retry 4 --output "/tmp/$archive" "$base/$archive"
            tar -xJf "/tmp/$archive" -C "$BLENDER_CACHE" --strip-components=1
          fi
          echo "$BLENDER_CACHE" >> "$GITHUB_PATH"

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0

      - name: Render oversampled 55 mm master
        run: |
          set -euo pipefail
          rm -rf bridge_output_012 bridge_output_013 bridge_output_014 bridge_output_015
          blender --background --factory-startup --python-exit-code 1 \
            --python blender/render_final_look.py
          test -s bridge_output_015/final-look-master-3200x2000.png
          cat bridge_output_015/final-look-render-manifest.json

      - name: Grade and downsample final looks
        run: |
          set -euo pipefail
          python scripts/grade_final_look.py
          cat bridge_output_015/final-look-grade-manifest.json

      - name: Verify final look
        run: |
          python scripts/verify_final_look.py \
            bridge_output_015/final-look-render-manifest.json \
            bridge_output_015/final-look-grade-manifest.json

      - name: Upload final photos only
        uses: actions/upload-artifact@v4
        with:
          name: coimbra-015-final-look-photos
          path: |
            bridge_output_015/final-look-neutral.png
            bridge_output_015/final-look-warm.png
            bridge_output_015/final-look-soft-cinematic.png
            bridge_output_015/final-look-render-manifest.json
            bridge_output_015/final-look-grade-manifest.json
          if-no-files-found: error
