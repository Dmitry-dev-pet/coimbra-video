name: Coimbra OpenTTD 004 towns

on:
  push:
    branches:
      - feature/coimbra-openttd-004-towns
    paths:
      - "openttd/**"
      - ".github/workflows/coimbra-openttd-004.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install converter dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=2,<3" "Pillow>=11,<13" "pyproj>=3.7,<4"

      - name: Run OpenTTD converter tests
        run: |
          python -m unittest openttd/test_build_pack.py -v
          python -m unittest openttd/test_build_road_plan.py -v
          python -m py_compile openttd/augment_gamescript_towns.py

      - name: Download pinned Coimbra 001 geodata
        uses: actions/download-artifact@v4
        with:
          repository: Dmitry-dev-pet/coimbra-video
          run-id: 37156903657
          name: coimbra-openttd-001
          github-token: \${{ github.token }}
          path: source_001

      - name: Normalize and verify pinned Coimbra 001 inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/coimbra-openttd-001 artifacts/coimbra-openttd-004
          heightmap="$(find source_001 -type f -name 'coimbra-heightmap.png' -print -quit)"
          towns="$(find source_001 -type f -name 'coimbra-towns.json' -print -quit)"
          network="$(find source_001 -type f -name 'coimbra-osm-network.geojson' -print -quit)"
          manifest="$(find source_001 -type f -name 'manifest.json' -print -quit)"
          test -n "$heightmap" && test -n "$towns" && test -n "$network" && test -n "$manifest"
          cp "$heightmap" artifacts/coimbra-openttd-001/coimbra-heightmap.png
          cp "$towns" artifacts/coimbra-openttd-001/coimbra-towns.json
          cp "$network" artifacts/coimbra-openttd-001/coimbra-osm-network.geojson
          cp "$manifest" artifacts/coimbra-openttd-001/manifest.json
          test "$(sha256sum artifacts/coimbra-openttd-001/coimbra-heightmap.png | awk '{print $1}')" = \
            "ebc6bff89db876aa7ff7697d91407aaff87e745bdb41553b3d71a6d5b00cd1f8"
          test "$(sha256sum artifacts/coimbra-openttd-001/coimbra-osm-network.geojson | awk '{print $1}')" = \
            "318b03ad879ab1c1601cfabe56a6e55349297e38e9d950fb8af136f26a60c9c4"

      - name: Build Coimbra transport network and real town layer
        run: |
          set -euo pipefail
          python openttd/build_road_plan.py \
            --network artifacts/coimbra-openttd-001/coimbra-osm-network.geojson \
            --manifest artifacts/coimbra-openttd-001/manifest.json \
            --heightmap artifacts/coimbra-openttd-001/coimbra-heightmap.png \
            --config openttd/config/coimbra-openttd-002.json \
            --out artifacts/coimbra-openttd-002

          python openttd/augment_gamescript_towns.py \
            --towns artifacts/coimbra-openttd-001/coimbra-towns.json \
            --game-dir artifacts/coimbra-openttd-002/game/CoimbraBuilder \
            --map-size 512 \
            --out-plan artifacts/coimbra-openttd-004/town-plan.json

          grep -F 'function TryFoundTown(item)' artifacts/coimbra-openttd-002/game/CoimbraBuilder/main.nut
          grep -F 'Coimbra urban layer complete.' artifacts/coimbra-openttd-002/game/CoimbraBuilder/main.nut
          grep -F 'Vale das Flores' artifacts/coimbra-openttd-002/game/CoimbraBuilder/towns.nut
          grep -F 'Bairro Norton de Matos' artifacts/coimbra-openttd-002/game/CoimbraBuilder/towns.nut
          grep -F 'Polo II' artifacts/coimbra-openttd-002/game/CoimbraBuilder/towns.nut
          grep -F 'Quinta da Portela' artifacts/coimbra-openttd-002/game/CoimbraBuilder/towns.nut

      - name: Install pinned OpenTTD 15.3 runtime and OpenGFX
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/coimbra-openttd-004-runtime"
          home="$RUNNER_TEMP/coimbra-openttd-004-home"
          mkdir -p "$runtime" "$home/.local/share/openttd/baseset" "$home/.local/share/openttd/game" \
            "$home/.local/share/openttd/save" "$home/.local/share/openttd/screenshot"

          curl -fsSLo "$runtime/openttd.tar.xz" \
            https://cdn.openttd.org/openttd-releases/15.3/openttd-15.3-linux-generic-amd64.tar.xz
          echo "f49eb25d61b00f8f4d332fee02b530ad75552d1efb8f2bb01e7ca5e6540fe059  $runtime/openttd.tar.xz" | sha256sum -c -
          mkdir -p "$runtime/openttd"
          tar -xJf "$runtime/openttd.tar.xz" -C "$runtime/openttd"
          openttd="$(find "$runtime/openttd" -type f -name openttd -perm -111 -print -quit)"
          test -n "$openttd"

          curl -fsSLo "$runtime/opengfx.zip" \
            https://cdn.openttd.org/opengfx-releases/8.0/opengfx-8.0-all.zip
          echo "43a0c1dabf39cb865394f3a6cc36d4da5c10ecfaaf55652043104806810903be  $runtime/opengfx.zip" | sha256sum -c -
          unzip -q "$runtime/opengfx.zip" -d "$home/.local/share/openttd/baseset"
          cp -R artifacts/coimbra-openttd-002/game/CoimbraBuilder "$home/.local/share/openttd/game/"

          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "home=$home" >> "$GITHUB_OUTPUT"
          echo "openttd=$openttd" >> "$GITHUB_OUTPUT"
          echo "bindir=$(dirname "$openttd")" >> "$GITHUB_OUTPUT"

      - name: Build complete Coimbra city and save real game
        shell: bash
        env:
          RUNTIME: \${{ steps.runtime.outputs.runtime }}
          HOME_DIR: \${{ steps.runtime.outputs.home }}
          OPENTTD: \${{ steps.runtime.outputs.openttd }}
        run: |
          set -euo pipefail
          cfg="$RUNTIME/build.cfg"
          log="$RUNTIME/build.log"
          cat > "$cfg" <<'EOF'
          [misc]
          language = english.lng

          [game_creation]
          starting_year = 1950
          ending_year = 2050
          map_x = 9
          map_y = 9
          custom_town_number = 0

          [difficulty]
          number_towns = 0
          industry_density = 0

          [gui]
          autosave_on_exit = true

          [network]
          server_port = 0

          [game_scripts]
          "Coimbra Builder" =
          EOF

          HOME="$HOME_DIR" "$OPENTTD" \
            -D 127.0.0.1:0 \
            -g "$GITHUB_WORKSPACE/artifacts/coimbra-openttd-001/coimbra-heightmap.png" \
            -I OpenGFX \
            -c "$cfg" \
            -x \
            -d script=4,misc=1 \
            > "$log" 2>&1 &
          pid=$!

          complete=0
          for _ in $(seq 1 900); do
            if grep -Fq "Coimbra urban layer complete." "$log" 2>/dev/null; then
              complete=1
              break
            fi
            if grep -Eq "script died unexpectedly|Your script made an error|too long to load script|Coimbra Builder requires" "$log" 2>/dev/null; then
              cat "$log"
              exit 2
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              exit 3
            fi
            sleep 1
          done
          test "$complete" -eq 1

          grep -F "Coimbra town built: Vale das Flores" "$log"
          grep -F "Coimbra town built: Bairro Norton de Matos" "$log"
          grep -F "Coimbra town built: Polo II" "$log"
          grep -F "Coimbra town built: Quinta da Portela" "$log"
          grep -F "towns ok=4 fail=0" "$log"
          grep -F "Coimbra network build complete." "$log"

          kill -TERM "$pid"
          for _ in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill -KILL "$pid" || true
            wait "$pid" || true
            cat "$log"
            exit 5
          fi
          wait "$pid" || true

          savefile="$(find "$RUNTIME" "$HOME_DIR" -type f -name 'exit.sav' -size +0c -print -quit 2>/dev/null || true)"
          test -n "$savefile" && test -s "$savefile"
          cp "$savefile" artifacts/coimbra-openttd-004/coimbra-openttd-004.sav
          cp "$log" artifacts/coimbra-openttd-004/build.log

      - name: Verify saved game with OpenTTD itself
        shell: bash
        env:
          HOME_DIR: \${{ steps.runtime.outputs.home }}
          OPENTTD: \${{ steps.runtime.outputs.openttd }}
        run: |
          set -euo pipefail
          HOME="$HOME_DIR" "$OPENTTD" -I OpenGFX \
            -q artifacts/coimbra-openttd-004/coimbra-openttd-004.sav \
            > artifacts/coimbra-openttd-004/save-info.txt 2>&1
          cat artifacts/coimbra-openttd-004/save-info.txt
          grep -F "Savegame ver:" artifacts/coimbra-openttd-004/save-info.txt

      - name: Install virtual display
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb xauth
          fi
          command -v xvfb-run

      - name: Build screenshot script for overview and four towns
        shell: bash
        env:
          BINDIR: \${{ steps.runtime.outputs.bindir }}
        run: |
          set -euo pipefail
          mkdir -p "$BINDIR/scripts"
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          plan = json.loads(Path("artifacts/coimbra-openttd-004/town-plan.json").read_text())
          lines = [
              "scrollto instant 256 256",
              "zoomto 3",
              "screenshot normal size 1280 720 coimbra-openttd-004-overview",
          ]
          for town in plan:
              slug = re.sub(r"[^a-z0-9]+", "-", town["name"].lower()).strip("-")
              lines += [
                  f"scrollto instant {town['x']} {town['y']}",
                  "zoomto 2",
                  f"screenshot normal size 1280 720 coimbra-openttd-004-{slug}",
              ]
          lines.append("screenshot minimap coimbra-openttd-004-minimap")
          Path("$BINDIR/scripts/game_start.scr").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Reload saved city and capture real OpenTTD frames
        shell: bash
        env:
          RUNTIME: \${{ steps.runtime.outputs.runtime }}
          HOME_DIR: \${{ steps.runtime.outputs.home }}
          OPENTTD: \${{ steps.runtime.outputs.openttd }}
          BINDIR: \${{ steps.runtime.outputs.bindir }}
        run: |
          set -euo pipefail
          render_log="$RUNTIME/render.log"
          (
            cd "$BINDIR"
            HOME="$HOME_DIR" xvfb-run -a "$OPENTTD" \
              -g "$GITHUB_WORKSPACE/artifacts/coimbra-openttd-004/coimbra-openttd-004.sav" \
              -I OpenGFX \
              -s null \
              -m null \
              -c "$RUNTIME/build.cfg" \
              -r 1280x720 \
              -x \
              -d script=3,misc=1
          ) > "$render_log" 2>&1 &
          pid=$!

          for _ in $(seq 1 120); do
            count="$(find "$RUNTIME" "$HOME_DIR" -type f -name 'coimbra-openttd-004-*.png' 2>/dev/null | wc -l | tr -d ' ')"
            if [ "$count" -ge 6 ]; then
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$render_log"
              exit 4
            fi
            sleep 1
          done

          mkdir -p artifacts/coimbra-openttd-004/screenshots
          find "$RUNTIME" "$HOME_DIR" -type f -name 'coimbra-openttd-004-*.png' -exec cp {} artifacts/coimbra-openttd-004/screenshots/ \;
          test "$(find artifacts/coimbra-openttd-004/screenshots -type f -name '*.png' | wc -l)" -ge 6
          cp "$render_log" artifacts/coimbra-openttd-004/render.log

          if kill -0 "$pid" 2>/dev/null; then kill "$pid" || true; fi
          wait "$pid" || true

          grep -F "Coimbra completed save loaded; network rebuild skipped." artifacts/coimbra-openttd-004/render.log

      - name: Verify frames and write manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          from PIL import Image

          root = Path("artifacts/coimbra-openttd-004")
          screenshots = sorted((root / "screenshots").glob("*.png"))
          build = (root / "build.log").read_text(errors="replace")
          town_plan = json.loads((root / "town-plan.json").read_text())

          assert len(town_plan) == 4, town_plan
          assert "towns ok=4 fail=0" in build
          for town in town_plan:
              assert f"Coimbra town built: {town['name']}" in build

          shot_meta = {}
          for path in screenshots:
              with Image.open(path) as im:
                  size = list(im.size)
                  if "minimap" in path.name:
                      assert im.size == (512, 512), (path, im.size)
                  else:
                      assert im.size == (1280, 720), (path, im.size)
                  shot_meta[path.name] = {"size": size, "mode": im.mode}

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          sav = root / "coimbra-openttd-004.sav"
          payload = {
              "version": "coimbra-openttd-004",
              "verified": True,
              "openttd_version": "15.3",
              "towns": town_plan,
              "town_count": 4,
              "all_towns_created": True,
              "savegame": {
                  "path": sav.name,
                  "bytes": sav.stat().st_size,
                  "sha256": sha(sav),
                  "verified_by_openttd_q": True,
              },
              "screenshots": shot_meta,
              "source_001_run_id": 37156903657,
              "source_003_verified_run_id": 37160880112,
          }
          (root / "manifest.json").write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n")
          print(json.dumps(payload, indent=2, ensure_ascii=False))
          PY

      - name: Package Coimbra OpenTTD 004
        run: |
          cp artifacts/coimbra-openttd-001/coimbra-heightmap.png artifacts/coimbra-openttd-004/
          cp artifacts/coimbra-openttd-001/coimbra-towns.json artifacts/coimbra-openttd-004/
          cp artifacts/coimbra-openttd-002/road-plan-manifest.json artifacts/coimbra-openttd-004/
          cp -R artifacts/coimbra-openttd-002/game artifacts/coimbra-openttd-004/
          cd artifacts
          zip -r coimbra-openttd-004.zip coimbra-openttd-004

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coimbra-openttd-004
          path: |
            artifacts/coimbra-openttd-004/
            artifacts/coimbra-openttd-004.zip
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
