name: Coimbra V2-001 registration

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  register:
    if: github.event.issue.user.login == 'Dmitry-dev-pet' && github.event.issue.title == '[v2] coimbra-001-register'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PHOTO_RUN_ID: "36926607350"
      DGT_RUN_ID: "36924783606"
    steps:
      - uses: actions/checkout@v4

      - name: Download fixed V2 photogrammetry source
        uses: actions/download-artifact@v4
        with:
          name: coimbra-v2-001-photogrammetry
          path: bridge_output_v2_001/photogrammetry
          github-token: ${{ github.token }}
          run-id: ${{ env.PHOTO_RUN_ID }}

      - name: Download fixed V2 DGT source
        uses: actions/download-artifact@v4
        with:
          name: coimbra-v2-001-dgt
          path: bridge_output_v2_001/dgt
          github-token: ${{ github.token }}
          run-id: ${{ env.DGT_RUN_ID }}

      - uses: ./.github/actions/setup-coimbra-blender

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install registration dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 opencv-python-headless==4.12.0.88 pyproj==3.7.2

      - name: Inspect photogrammetry in Blender
        run: |
          blender --background --factory-startup --python-exit-code 1 \
            --python blender/inspect_v2_001_photogrammetry.py

      - name: Register photogrammetry to DGT
        run: python scripts/register_v2_001_photogrammetry.py

      - name: Show registration receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("bridge_output_v2_001/registration/registration.json").read_text())
          print(json.dumps({
            "version": p["version"],
            "feature_matches": p["feature_matches"],
            "inliers": p["inliers"],
            "inlier_ratio": p["inlier_ratio"],
            "scale": p["scale"],
            "rotation_z_degrees": p["rotation_z_degrees"],
            "translation_local_xy_m": p["translation_local_xy_m"],
            "translation_local_z_m": p["translation_local_z_m"],
            "vertical_evidence": p["vertical_evidence"],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: coimbra-v2-001-registration
          path: bridge_output_v2_001/registration
          compression-level: 1
          retention-days: 30
          if-no-files-found: error

  receipt:
    if: always() && github.event.issue.user.login == 'Dmitry-dev-pet' && github.event.issue.title == '[v2] coimbra-001-register'
    needs: [register]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      RESULT: ${{ needs.register.result }}
    steps:
      - name: Publish sanitized receipt
        run: |
          body="Coimbra V2-001 registration: $RESULT."
          if [ "$RESULT" = "success" ]; then
            body="$body Registration artifact is ready for the hero-frame renderer."
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            body="$body Inspect the Actions run; no source credentials are emitted."
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
