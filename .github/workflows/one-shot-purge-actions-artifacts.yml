# Owner-approved one-shot cleanup. Delete this workflow after successful run.
name: One-shot purge all Actions artifacts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-purge-actions-artifacts.yml

permissions:
  contents: read

concurrency:
  group: one-shot-artifact-purge-coimbra-video
  cancel-in-progress: false

jobs:
  purge:
    if: ${{ github.repository == 'Dmitry-dev-pet/coimbra-video' && github.actor == github.repository_owner && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - name: Delete every preexisting Actions artifact in this repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          REPO = "Dmitry-dev-pet/coimbra-video"
          BRANCH = "refs/heads/main"
          assert os.environ["GITHUB_REPOSITORY"] == REPO
          assert os.environ["GITHUB_REF"] == BRANCH
          assert os.environ["GITHUB_EVENT_NAME"] == "push"
          assert os.environ["GITHUB_ACTOR"] == "Dmitry-dev-pet"
          token = os.environ["GH_TOKEN"]
          endpoint = "https://api.github.com/repos/" + REPO
          cutoff = datetime.datetime.now(datetime.timezone.utc)

          def request(path, method="GET"):
              req = urllib.request.Request(
                  endpoint + path,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "owner-one-shot-actions-artifact-purge",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  if method == "DELETE":
                      if response.status != 204:
                          raise RuntimeError("Unexpected artifact deletion status")
                      return None
                  return json.loads(body)

          def all_artifacts():
              results = []
              for page in range(1, 101):
                  query = urllib.parse.urlencode({"per_page": 100, "page": page})
                  batch = request("/actions/artifacts?" + query).get("artifacts")
                  if not isinstance(batch, list):
                      raise RuntimeError("Unexpected artifact listing")
                  results.extend(batch)
                  if len(batch) < 100:
                      break
              else:
                  raise RuntimeError("More than 100 pages: refuse incomplete purge")
              return results

          def eligible(a):
              if a.get("expired", False):
                  return False
              value = a.get("created_at")
              if not isinstance(value, str):
                  raise RuntimeError("Artifact timestamp missing")
              timestamp = datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))
              if timestamp.tzinfo is None:
                  raise RuntimeError("Artifact timestamp lacks timezone")
              if not isinstance(a.get("id"), int):
                  raise RuntimeError("Artifact ID missing")
              return timestamp <= cutoff

          available = all_artifacts()
          selected = [a for a in available if eligible(a)]
          bytes_total = sum(a["size_in_bytes"] for a in selected)
          if len(selected) > 10000 or bytes_total > 24 * 1024 ** 3:
              raise RuntimeError("Purge exceeds bounded safety envelope")
          if len({a["id"] for a in selected}) != len(selected):
              raise RuntimeError("Duplicate artifact IDs")
          print("PURGE_PLAN " + json.dumps({
              "repo": REPO, "cutoff_utc": cutoff.isoformat(),
              "count": len(selected), "mib": round(bytes_total / 1048576, 3)
          }, sort_keys=True), flush=True)
          deleted = 0
          deleted_bytes = 0
          for a in selected:
              try:
                  request("/actions/artifacts/" + str(a["id"]), "DELETE")
                  deleted += 1
                  deleted_bytes += a["size_in_bytes"]
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
              if deleted % 50 == 0 and deleted:
                  print("PURGE_PROGRESS " + str(deleted), flush=True)
          remaining = [a for a in all_artifacts() if eligible(a)]
          if remaining:
              raise RuntimeError(str(len(remaining)) + " old artifacts still remain")
          print("PURGE_RESULT " + json.dumps({
              "repo": REPO, "deleted": deleted,
              "deleted_mib": round(deleted_bytes / 1048576, 3),
              "remaining_before_cutoff": len(remaining),
              "verified": True
          }, sort_keys=True), flush=True)
          PY
