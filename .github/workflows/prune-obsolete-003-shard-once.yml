name: Prune obsolete Coimbra 003 failed-render shard once

on:
  push:
    branches: [main]
    paths: [.github/workflows/prune-obsolete-003-shard-once.yml]
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply exact historical shard deletion; manual default dry-run"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    if: ${{ github.repository == 'Dmitry-dev-pet/coimbra-video' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      APPLY: ${{ github.event_name == 'push' || inputs.apply == true }}
    steps:
      - name: Remove only historical failed 003 slow-frame shard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          REPO = "Dmitry-dev-pet/coimbra-video"
          RUN_ID = 36438419699
          ARTIFACT_ID = 10976418950
          NAME = "coimbra-003-slow-frames-09"
          assert os.environ["GITHUB_REPOSITORY"] == REPO
          assert os.environ["GITHUB_REF"] == "refs/heads/main"
          token = os.environ["GH_TOKEN"]
          apply = os.environ.get("APPLY", "").lower() == "true"

          def api(path, method="GET"):
              request = Request("https://api.github.com/repos/" + REPO + path,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
              with urlopen(request, timeout=25) as response:
                  raw = response.read()
              return json.loads(raw) if raw else None

          previous = api("/actions/runs/" + str(RUN_ID))
          accepted = api("/actions/runs/36446742503")
          if (previous.get("name") != "Coimbra DGT terrain slow flight 003"
              or previous.get("conclusion") != "failure"
              or previous.get("status") != "completed"
              or accepted.get("conclusion") != "success"):
              raise RuntimeError("Historical run identity/accepted successor mismatch")

          arts = api("/actions/runs/" + str(RUN_ID) + "/artifacts?per_page=100")
          if arts.get("total_count") != 1:
              raise RuntimeError("Expected only the single stranded frame shard")
          a = arts["artifacts"][0]
          if (a.get("id") != ARTIFACT_ID or a.get("name") != NAME
              or a.get("expired") or int(a.get("size_in_bytes", 0)) > 20 * 1048576):
              raise RuntimeError("Wrong artifact identity, expiration or size")

          print(json.dumps({"mode": "apply" if apply else "dry-run",
                "run_id": RUN_ID, "artifact_id": ARTIFACT_ID,
                "name": NAME, "mib": round(a["size_in_bytes"] / 1048576, 2),
                "preserved": ["coimbra-009a-mosaiq-benchmark",
                              "coimbra-038-web-route-dist", "accepted 032/033"]}, indent=2))
          if apply:
              api("/actions/artifacts/" + str(ARTIFACT_ID), method="DELETE")
              print("DELETED id=%s bytes=%s" % (ARTIFACT_ID, a["size_in_bytes"]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Coimbra obsolete failed-render shard\n")
              f.write("- Mode: %s\n" % ("apply" if apply else "dry-run"))
              f.write("- Selected artifact: %s, %.2f MiB\n" %
                      (ARTIFACT_ID, a["size_in_bytes"] / 1048576))
              f.write("- All final scenes, public site, and source benchmarks retained.\n")
          PY
