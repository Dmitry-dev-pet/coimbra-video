name: Coimbra Earth Studio post-process

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preview.yml"
      - "scripts/earth_studio_post.py"
      - "EARTH_STUDIO.md"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      source_url:
        description: "Direct URL to the ZIP rendered by Google Earth Studio"
        required: false
        default: ""
        type: string
      fps:
        description: "Frame rate used in the Earth Studio project"
        required: false
        default: "30"
        type: choice
        options:
          - "24"
          - "25"
          - "30"
          - "50"
          - "60"
      focus_y:
        description: "Vertical focus-line position (0 top, 1 bottom)"
        required: false
        default: "0.48"
        type: string
      tilt:
        description: "Focus-line slope"
        required: false
        default: "-0.14"
        type: string

permissions:
  contents: read

concurrency:
  group: coimbra-earth-studio
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Earth Studio pipeline
        run: |
          python -m compileall -q scripts/earth_studio_post.py
          python scripts/earth_studio_post.py --help

  render:
    if: github.event_name == 'workflow_dispatch' && inputs.source_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Earth Studio render ZIP
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          mkdir -p input
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" --output input/earth_studio.zip
          test -s input/earth_studio.zip
          unzip -t input/earth_studio.zip >/dev/null

      - name: Apply tilt-shift and encode MP4
        run: |
          mkdir -p output
          python scripts/earth_studio_post.py \
            --input input/earth_studio.zip \
            --output output/coimbra_earthstudio_tiltshift.mp4 \
            --fps "${{ inputs.fps }}" \
            --focus-y "${{ inputs.focus_y }}" \
            --tilt "${{ inputs.tilt }}"

      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: coimbra-earthstudio-video
          path: output/coimbra_earthstudio_tiltshift.mp4
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
