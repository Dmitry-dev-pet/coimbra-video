name: Coimbra 038 exact web route

on:
  pull_request:
    paths:
      - web/**
      - blender/export_032_web_glb.py
      - scripts/export_webgpu_coimbra.py
      - scripts/test_webgpu_export.py
      - scripts/fetch_osm_bridge.py
      - scripts/prepare_osm_local_for_terrain.py
      - docs/specs/SPEC-COIMBRA-WEB-ROUTE-1.md
      - .github/workflows/coimbra-038-web-route.yml
      - .github/workflows/coimbra-037-web-parity.yml
      - .github/workflows/coimbra-034-webgpu-feasibility.yml
  push:
    branches: [main]
    paths:
      - web/**
      - blender/export_032_web_glb.py
      - scripts/export_webgpu_coimbra.py
      - scripts/test_webgpu_export.py
      - scripts/fetch_osm_bridge.py
      - scripts/prepare_osm_local_for_terrain.py
      - docs/specs/SPEC-COIMBRA-WEB-ROUTE-1.md
      - .github/workflows/coimbra-038-web-route.yml
      - .github/workflows/coimbra-037-web-parity.yml
      - .github/workflows/coimbra-034-webgpu-feasibility.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_CACHE: "/home/runner/.cache/blender-5.2.2"
  SOURCE_030_RUN_ID: "36720891074"
  SOURCE_030_BLEND_SHA256: "5fe8ca9e8605c6ea1908d8a814f9ad5209248c606b34ebbbb3dd47607edff881"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Download accepted Coimbra 030/032 production scene
        uses: actions/download-artifact@v4
        with:
          repository: Dmitry-dev-pet/coimbra-video
          run-id: ${{ env.SOURCE_030_RUN_ID }}
          name: coimbra-030-production-look-review
          github-token: ${{ github.token }}
          path: source_030_download

      - name: Normalize and verify frozen production source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_030 bridge_output_038
          blend="$(find source_030_download -type f -name 'coimbra-production-look.blend' -print -quit)"
          reference="$(find source_030_download -type f -name 'frame-181-candidate.png' -print -quit)"
          test -n "$blend"
          test -n "$reference"
          cp "$blend" source_030/coimbra-production-look.blend
          cp "$reference" bridge_output_038/frame-181-reference.png
          test "$(sha256sum source_030/coimbra-production-look.blend | awk '{print $1}')" = "$SOURCE_030_BLEND_SHA256"

      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/blender-5.2.2
          key: blender-linux-x64-5.2.2

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_CACHE"
          if [ ! -x "$BLENDER_CACHE/blender" ]; then
            archive="blender-$BLENDER_VERSION-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender5.2"
            curl --fail --location --retry 4 --output "/tmp/$archive" "$base/$archive"
            tar -xJf "/tmp/$archive" -C "$BLENDER_CACHE" --strip-components=1
          fi
          echo "$BLENDER_CACHE" >> "$GITHUB_PATH"

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             libegl1 libgl1 libx11-6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0

      - name: Export accepted scene and exact 032 camera route
        shell: bash
        run: |
          set -euo pipefail
          blender             --background             --factory-startup             --python-exit-code 1             --python blender/export_032_web_glb.py             --             --blend source_030/coimbra-production-look.blend             --out bridge_output_038

      - name: Verify GLB and exact route contract
        run: |
          python - <<'PY'
          import json
          import math
          import struct
          from pathlib import Path

          root = Path("bridge_output_038")
          manifest = json.loads((root / "export-manifest.json").read_text())
          route = json.loads((root / "coimbra-032-camera-route.json").read_text())
          glb = root / "coimbra-032-frame181.glb"\n          route_glb = root / "coimbra-032-route.glb"
          raw = glb.read_bytes()
          magic, version, declared = struct.unpack("<4sII", raw[:12])

          assert magic == b"glTF"
          assert version == 2
          assert declared == len(raw)
          assert manifest["source_blend_sha256"] == "5fe8ca9e8605c6ea1908d8a814f9ad5209248c606b34ebbbb3dd47607edff881"
          assert manifest["frame"] == 181
          assert manifest["object_types"].get("MESH", 0) > 0
          assert manifest["mesh_vertices"] > 10000
          assert manifest["mesh_triangles"] > 10000
          assert manifest["materials"] > 0
          assert manifest["glb"]["bytes"] == len(raw)\n          assert route_glb.stat().st_size == manifest["route_glb"]["bytes"]\n          route_raw = route_glb.read_bytes()\n          _, _, route_declared = struct.unpack("<4sII", route_raw[:12])\n          assert route_declared == len(route_raw)\n          json_len, json_type = struct.unpack("<II", route_raw[12:20])\n          assert json_type == 0x4E4F534A\n          gltf_json = json.loads(route_raw[20:20 + json_len].decode("utf-8").rstrip(" \\x00"))\n          assert gltf_json.get("animations"), "Route GLB has no baked animation"\n          assert gltf_json.get("cameras"), "Route GLB has no camera"

          assert route["version"] == "coimbra-038-web-route-v2"
          assert route["output_frame_count"] == 1440
          assert route["fps"] == 60
          assert math.isclose(route["duration_seconds"], 24.0, abs_tol=1e-12)
          assert len(route["samples"]) == 1440
          assert math.isclose(route["samples"][0]["source_frame"], 1.0, abs_tol=1e-12)
          assert math.isclose(route["samples"][-1]["source_frame"], 360.0, abs_tol=1e-12)
          assert math.isclose(route["anchor"]["source_frame"], 181.0, abs_tol=1e-12)
          assert all(len(sample["matrix_world"]) == 16 for sample in route["samples"])
          assert len(route["anchor"]["matrix_world"]) == 16

          for index in (1, 361, 721, 1081, 1440):
              expected = 1.0 + (index - 1) * 359.0 / 1439.0
              actual = route["samples"][index - 1]["source_frame"]
              assert math.isclose(actual, expected, abs_tol=1e-10), (index, actual, expected)

          print(json.dumps({
              "glb_mb": round(len(raw) / 1024 / 1024, 2),
              "vertices": manifest["mesh_vertices"],
              "triangles": manifest["mesh_triangles"],
              "materials": manifest["materials"],
              "route_samples": len(route["samples"]),
              "route_bytes": (root / "coimbra-032-camera-route.json").stat().st_size,\n              "route_glb_mb": round(route_glb.stat().st_size / 1024 / 1024, 2),
              "fps": route["fps"],
              "duration_seconds": route["duration_seconds"],
          }, indent=2))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 034 dataset dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 requests==2.32.5 pyproj==3.7.2

      - name: Build preserved 034 root dataset
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fetch_osm_bridge.py
          python scripts/prepare_osm_local_for_terrain.py
          python scripts/export_webgpu_coimbra.py

      - name: Stage 037 and 038 accepted-scene assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/public/037/data web/public/038/data

          cp bridge_output_038/coimbra-032-frame181.glb web/public/037/data/
          cp bridge_output_038/frame-181-reference.png web/public/037/data/
          cp bridge_output_038/export-manifest.json web/public/037/data/

          cp bridge_output_038/coimbra-032-camera-route.json web/public/038/data/\n          cp bridge_output_038/coimbra-032-route.glb web/public/038/data/
          cp bridge_output_038/frame-181-reference.png web/public/038/data/
          cp bridge_output_038/export-manifest.json web/public/038/data/

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build combined 034 + 037 + 038 site
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify combined Pages dist
        run: |
          set -euo pipefail
          test -s web/dist/index.html
          test -s web/dist/data/coimbra/index.json
          test -s web/dist/037/index.html
          test -s web/dist/037/data/coimbra-032-frame181.glb
          test -s web/dist/037/data/frame-181-reference.png
          test -s web/dist/037/data/export-manifest.json
          test -s web/dist/038/index.html
          test -s web/dist/038/data/coimbra-032-camera-route.json\n          test -s web/dist/038/data/coimbra-032-route.glb
          test -s web/dist/038/data/frame-181-reference.png
          test -s web/dist/038/data/export-manifest.json

          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("web/dist/037/data/export-manifest.json").read_text())
          route = json.loads(Path("web/dist/038/data/coimbra-032-camera-route.json").read_text())
          glb = Path("web/dist/037/data/coimbra-032-frame181.glb")
          assert glb.stat().st_size == manifest["glb"]["bytes"]
          assert route["output_frame_count"] == 1440
          assert route["fps"] == 60
          assert len(route["samples"]) == 1440
          print(json.dumps({
              "037_glb_mb": round(glb.stat().st_size / 1024 / 1024, 2),
              "038_route_kb": round(Path("web/dist/038/data/coimbra-032-camera-route.json").stat().st_size / 1024, 1),
              "root_034_preserved": True,
              "still_037_preserved": True,
              "route_038_present": True,
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: coimbra-038-web-route-dist
          path: web/dist
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coimbra-038-web-route-dist
          path: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy combined Coimbra 034 + 037 + 038 site
        id: deployment
        uses: actions/deploy-pages@v4
