name: Coimbra textured APatch Blender 002

on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_dgt_ortho_bridge.py"
      - "blender/build_osm_textured_scene.py"
      - "contracts/COIMBRA-BRIDGE-002.json"
      - ".github/workflows/coimbra-apatch-blender-002.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_CACHE: "/home/runner/.cache/blender-5.2.2"
  BRIDGE_REF: "ea7441cd03bc8a9a4036b64470e358220943a98a"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Checkout APatch Blender
        uses: actions/checkout@v4
        with:
          repository: Dmitry-dev-pet/apatch-blender
          ref: ${{ env.BRIDGE_REF }}
          path: _bridge

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch OSM and DGT orthophoto
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "requests>=2.32,<3" "Pillow>=11,<12" "pyproj>=3.7,<4"
          python scripts/fetch_osm_bridge.py
          python scripts/fetch_dgt_ortho_bridge.py

      - name: Cache Blender
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/blender-5.2.2
          key: blender-linux-x64-5.2.2

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_CACHE"
          if [ ! -x "$BLENDER_CACHE/blender" ]; then
            archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender5.2"
            curl --fail --location --retry 4 --output "/tmp/$archive" "$base/$archive"
            tar -xJf "/tmp/$archive" -C "$BLENDER_CACHE" --strip-components=1
          fi
          echo "$BLENDER_CACHE" >> "$GITHUB_PATH"

      - name: Install Blender runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0

      - name: Build textured protected base
        run: |
          rm -rf bridge_output_002
          blender --background --factory-startup --python-exit-code 1 \
            --python blender/build_osm_textured_scene.py

      - name: Execute 002 contract
        run: |
          blender --background --factory-startup --python-exit-code 1 \
            --python _bridge/scripts/execute_contract.py -- \
            --contract "$GITHUB_WORKSPACE/contracts/COIMBRA-BRIDGE-002.json" \
            --root "$GITHUB_WORKSPACE"

      - name: Upload prepared 002
        uses: actions/upload-artifact@v4
        with:
          name: coimbra-002-prepared
          path: |
            bridge_output_002/coimbra-textured-base.blend
            bridge_output_002/coimbra-textured-edited.blend
            bridge_output_002/base-manifest.json
            bridge_output_002/execution.json
            bridge_output_002/preview.png
          if-no-files-found: error

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: "01", start: 1, end: 30 }
          - { shard: "02", start: 31, end: 60 }
          - { shard: "03", start: 61, end: 90 }
          - { shard: "04", start: 91, end: 120 }
          - { shard: "05", start: 121, end: 150 }
          - { shard: "06", start: 151, end: 180 }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/blender-5.2.2
          key: blender-linux-x64-5.2.2
      - name: Install Blender
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_CACHE"
          if [ ! -x "$BLENDER_CACHE/blender" ]; then
            archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender5.2"
            curl --fail --location --retry 4 --output "/tmp/$archive" "$base/$archive"
            tar -xJf "/tmp/$archive" -C "$BLENDER_CACHE" --strip-components=1
          fi
          echo "$BLENDER_CACHE" >> "$GITHUB_PATH"
      - name: Install Blender runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0
      - uses: actions/download-artifact@v4
        with:
          name: coimbra-002-prepared
          path: bridge_output_002
      - name: Render shard
        env:
          START_FRAME: ${{ matrix.start }}
          END_FRAME: ${{ matrix.end }}
        run: |
          mkdir -p bridge_output_002/frames
          blender bridge_output_002/coimbra-textured-edited.blend --background \
            -s "$START_FRAME" -e "$END_FRAME" \
            -o "$GITHUB_WORKSPACE/bridge_output_002/frames/frame_" -F PNG --render-anim
          test "$(find bridge_output_002/frames -name 'frame_*.png' | wc -l)" -eq $((END_FRAME-START_FRAME+1))
      - uses: actions/upload-artifact@v4
        with:
          name: coimbra-002-frames-${{ matrix.shard }}
          path: bridge_output_002/frames/
          if-no-files-found: error
          compression-level: 1

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Dmitry-dev-pet/apatch-blender
          ref: ${{ env.BRIDGE_REF }}
          path: _bridge
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/blender-5.2.2
          key: blender-linux-x64-5.2.2
      - name: Install Blender
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_CACHE"
          if [ ! -x "$BLENDER_CACHE/blender" ]; then
            archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            base="https://download.blender.org/release/Blender5.2"
            curl --fail --location --retry 4 --output "/tmp/$archive" "$base/$archive"
            tar -xJf "/tmp/$archive" -C "$BLENDER_CACHE" --strip-components=1
          fi
          echo "$BLENDER_CACHE" >> "$GITHUB_PATH"
      - name: Install verifier deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0 ffmpeg fonts-dejavu-core
      - uses: actions/download-artifact@v4
        with:
          name: coimbra-002-prepared
          path: bridge_output_002
      - uses: actions/download-artifact@v4
        with:
          pattern: coimbra-002-frames-*
          path: bridge_output_002/frames
          merge-multiple: true
      - name: Encode 002
        run: |
          test "$(find bridge_output_002/frames -name 'frame_*.png' | wc -l)" -eq 180
          ffmpeg -y -framerate 30 -start_number 1 \
            -i bridge_output_002/frames/frame_%04d.png \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Ortho © DGT 2025 · CC BY 4.0   |   Map data © OpenStreetMap contributors · ODbL':fontcolor=white:fontsize=13:x=12:y=h-th-10:box=1:boxcolor=black@0.4:boxborderw=4" \
            -c:v libx264 -pix_fmt yuv420p -crf 19 -movflags +faststart \
            bridge_output_002/coimbra-textured.mp4
      - name: Verify 002
        run: |
          blender --background --factory-startup --python-exit-code 1 \
            --python _bridge/scripts/verify_contract.py -- \
            --contract "$GITHUB_WORKSPACE/contracts/COIMBRA-BRIDGE-002.json" \
            --root "$GITHUB_WORKSPACE"
          cat bridge_output_002/verification.json
      - run: rm -rf bridge_output_002/frames
      - uses: actions/upload-artifact@v4
        with:
          name: coimbra-apatch-blender-002
          path: bridge_output_002/
          if-no-files-found: error
