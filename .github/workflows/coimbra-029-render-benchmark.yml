name: Coimbra 029 render benchmark contract

on:
  pull_request:
    paths:
      - blender/render_cycles_benchmark_segment.py
      - scripts/summarize_cycles_render_benchmark.py
      - scripts/test_cycles_render_benchmark.py
      - docs/specs/SPEC-COIMBRA-RENDER-BENCHMARK-1.md
      - .github/workflows/coimbra-029-render-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile benchmark scripts
        run: |
          python -m compileall -q             blender/render_cycles_benchmark_segment.py             scripts/summarize_cycles_render_benchmark.py             scripts/test_cycles_render_benchmark.py
      - name: Run benchmark summary tests
        run: python -m unittest discover -s scripts -p 'test_cycles_render_benchmark.py' -v
