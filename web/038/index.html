<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Coimbra 038: the accepted Coimbra 032 24-second / 60 fps production camera route running in the browser."
    />
    <title>Coimbra 038 · 032 route in browser</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080d12;
        color: #eef3f6;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080d12; }
      body { display: grid; place-items: center; }
      #stage {
        position: relative;
        width: min(100vw, 160vh);
        aspect-ratio: 8 / 5;
        max-height: 100vh;
        overflow: hidden;
        background: rgb(19, 24, 33);
        box-shadow: 0 0 80px rgba(0,0,0,.55);
      }
      #app, #app canvas { width: 100%; height: 100%; display: block; }
      #reference {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        opacity: 0;
        pointer-events: none;
        transition: opacity .15s linear;
        z-index: 3;
      }
      #reference.shown { opacity: .72; }
      #hud {
        position: absolute;
        left: 14px;
        top: 14px;
        width: min(470px, calc(100% - 28px));
        padding: 12px 14px;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 12px;
        background: rgba(6, 11, 17, .82);
        backdrop-filter: blur(12px);
        font-size: 13px;
        line-height: 1.45;
        z-index: 4;
      }
      #hud strong { font-size: 14px; }
      #status { margin-top: 7px; color: #c7d2da; }
      #clock { margin-top: 3px; font-variant-numeric: tabular-nums; color: #dbe7ef; }
      .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      button, a {
        padding: 7px 10px;
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 8px;
        color: inherit;
        background: rgba(255,255,255,.08);
        text-decoration: none;
        cursor: pointer;
      }
      button:hover, a:hover { background: rgba(255,255,255,.14); }
      #timeline {
        width: 100%;
        margin-top: 11px;
        accent-color: white;
      }
      #credit {
        position: absolute;
        right: 10px;
        bottom: 8px;
        padding: 5px 8px;
        border-radius: 6px;
        background: rgba(6, 11, 17, .72);
        color: #d4dde3;
        font-size: 11px;
        z-index: 4;
      }
      body.failed #status { color: #ffb7ae; }
    </style>
  </head>
  <body>
    <main id="stage">
      <div id="app"></div>
      <img id="reference" src="./data/frame-181-reference.png" alt="Accepted Coimbra 032 production-look frame 181 reference" />
      <aside id="hud">
        <strong>Coimbra 038 · exact 032 camera route in browser</strong>
        <div id="status">Starting WebGPU renderer…</div>
        <div id="clock">00.00 / 24.00 s · 60 fps</div>
        <input id="timeline" type="range" min="0" max="1439" step="1" value="0" aria-label="Coimbra 032 route timeline" />
        <div class="buttons">
          <button id="play-pause" type="button">Pause</button>
          <button id="restart" type="button">Restart</button>
          <button id="compare-181" type="button">Compare frame 181</button>
          <a href="../037/">Open 037 still</a>
        </div>
      </aside>
      <div id="credit">Accepted Coimbra 032 scene · DGT · © OpenStreetMap contributors · ODbL</div>
    </main>
    <script type="module" src="/src/038.ts"></script>
  </body>
</html>
