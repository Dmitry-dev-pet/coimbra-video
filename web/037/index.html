<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Coimbra 037: browser visual-parity review exported from the accepted Coimbra 032 production scene."
    />
    <title>Coimbra 037 · 032 web parity</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080d12;
        color: #eef3f6;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080d12; }
      body { display: grid; place-items: center; }
      #stage {
        position: relative;
        width: min(100vw, 160vh);
        aspect-ratio: 8 / 5;
        max-height: 100vh;
        overflow: hidden;
        background: #132033;
        box-shadow: 0 0 80px rgba(0,0,0,.55);
      }
      #app, #app canvas { width: 100%; height: 100%; display: block; }
      #reference {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        opacity: 0;
        pointer-events: none;
        transition: opacity .15s linear;
      }
      #reference.shown { opacity: .72; }
      #hud {
        position: absolute;
        left: 14px;
        top: 14px;
        width: min(410px, calc(100% - 28px));
        padding: 12px 14px;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 12px;
        background: rgba(6, 11, 17, .80);
        backdrop-filter: blur(12px);
        font-size: 13px;
        line-height: 1.45;
        z-index: 4;
      }
      #hud strong { font-size: 14px; }
      #status { margin-top: 7px; color: #c7d2da; }
      .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      button, a {
        padding: 7px 10px;
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 8px;
        color: inherit;
        background: rgba(255,255,255,.08);
        text-decoration: none;
        cursor: pointer;
      }
      button:hover, a:hover { background: rgba(255,255,255,.14); }
      #credit {
        position: absolute;
        right: 10px;
        bottom: 8px;
        padding: 5px 8px;
        border-radius: 6px;
        background: rgba(6, 11, 17, .72);
        color: #d4dde3;
        font-size: 11px;
        z-index: 4;
      }
      body.failed #status { color: #ffb7ae; }
    </style>
  </head>
  <body>
    <main id="stage">
      <div id="app"></div>
      <img id="reference" src="./data/frame-181-reference.png" alt="Accepted Coimbra production-look frame 181 reference" />
      <aside id="hud">
        <strong>Coimbra 037 · accepted 032 scene in browser</strong>
        <div id="status">Starting WebGPU renderer…</div>
        <div class="buttons">
          <button id="toggle-reference" type="button">Show 032 reference</button>
          <button id="reset-camera" type="button">Reset frame 181 camera</button>
          <a href="../">Open 034 prototype</a>
        </div>
      </aside>
      <div id="credit">Accepted Coimbra production scene · DGT · © OpenStreetMap contributors · ODbL</div>
    </main>
    <script type="module" src="/src/037.ts"></script>
  </body>
</html>
