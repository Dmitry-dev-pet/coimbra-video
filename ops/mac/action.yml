name: Mac project package preflight
description: Verify and stage fixed helpers only; no Blender, network, GUI or device access.
outputs:
  ready:
    description: Package preparation and syntax checks passed.
    value: ${{ steps.check.outputs.ready }}
runs:
  using: composite
  steps:
    - name: Prepare fixed helpers
      shell: bash
      env:
        PACKAGE_ROOT: ${{ github.action_path }}
      run: python3 "$PACKAGE_ROOT/materialize.py"
    - name: Check staged package without executing project code
      id: check
      shell: bash
      env:
        PACKAGE_ROOT: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import ast, json, os, subprocess
        from pathlib import Path
        root = Path(os.environ["PACKAGE_ROOT"])
        for name in json.loads((root / "manifest.json").read_text())["files"]:
            path = root / name
            if name.endswith(".py"):
                ast.parse(path.read_text(), filename=name)
            else:
                subprocess.run(["bash", "-n", str(path)], check=True)
        print("Package staged and syntax verified; no rendering or device I/O performed")
        PY
        echo 'ready=true' >> "$GITHUB_OUTPUT"
