name: Coimbra 035 visual polish review
description: Fixed visual review with preserved production and human-review boundaries.
outputs:
  result:
    description: Sanitized review evidence.
    value: ${{ steps.result.outputs.result }}
runs:
  using: composite
  steps:
    - name: Prepare project package
      shell: bash
      env:
        COIMBRA_ACTION_DIR: ${{ github.action_path }}
      run: python3 "$COIMBRA_ACTION_DIR/../prepare.py"

    - name: Checkout fixed Coimbra 035 source
      shell: bash
      run: |
        set -euo pipefail
        rm -rf coimbra
        git init coimbra
        git -C coimbra remote add origin https://github.com/Dmitry-dev-pet/coimbra-video.git
        git -C coimbra fetch --depth=1 origin "$COIMBRA_SOURCE_SHA"
        git -C coimbra checkout --detach FETCH_HEAD
        test "$(git -C coimbra rev-parse HEAD)" = "$COIMBRA_SOURCE_SHA"

    - name: Download accepted Coimbra 030 production look
      uses: actions/download-artifact@v4
      with:
        repository: Dmitry-dev-pet/coimbra-video
        run-id: ${{ env.COIMBRA_030_RUN_ID }}
        name: coimbra-030-production-look-review
        github-token: ${{ github.token }}
        path: source_030_download

    - name: Download accepted Coimbra 026 prepare evidence
      uses: actions/download-artifact@v4
      with:
        repository: Dmitry-dev-pet/coimbra-video
        run-id: ${{ env.COIMBRA_026_RUN_ID }}
        name: coimbra-026-prepared
        github-token: ${{ github.token }}
        path: source_026_download

    - name: Normalize and verify pinned Coimbra 035 sources
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p source_030 source_026
        blend="$(find source_030_download -type f -name 'coimbra-production-look.blend' -print -quit)"
        review="$(find source_030_download -type f -name 'production-look-review.json' -print -quit)"
        prepare="$(find source_026_download -type f -name 'prepare.json' -print -quit)"
        test -n "$blend"
        test -n "$review"
        test -n "$prepare"
        cp "$blend" source_030/coimbra-production-look.blend
        cp "$review" source_030/production-look-review.json
        cp "$prepare" source_026/prepare.json
        test "$(shasum -a 256 source_030/coimbra-production-look.blend | awk '{print $1}')" = "$COIMBRA_030_BLEND_SHA256"

    - name: Resolve fixed Blender executable
      id: blender035
      shell: bash
      run: |
        set -euo pipefail
        if command -v blender >/dev/null 2>&1; then
          path="$(command -v blender)"
        elif [[ -x /Applications/Blender.app/Contents/MacOS/Blender ]]; then
          path=/Applications/Blender.app/Contents/MacOS/Blender
        else
          echo "::error::Blender is not installed in an approved location"
          exit 2
        fi
        echo "path=$path" >> "$GITHUB_OUTPUT"

    - name: Render and verify Coimbra 035 visual polish review
      shell: bash
      env:
        BLENDER_PATH: ${{ steps.blender035.outputs.path }}
      run: bash scripts/run_coimbra_035.sh

    - name: Prepare sanitized 035 result
      id: result
      shell: bash
      run: |
        set -euo pipefail
        result="$(
          python3 - <<'PY'
        import json
        from pathlib import Path

        root = Path("artifacts/coimbra-035")
        verification = json.loads((root / "verification.json").read_text())
        review = json.loads((root / "visual-polish-review.json").read_text())
        metrics = json.loads((root / "image-difference-metrics.json").read_text())

        variants = {}
        for name, payload in review["variants"].items():
            diffs = [
                metrics["metrics"][str(frame)][name]["mean_abs_rgb_average_255"]
                for frame in review["checkpoint_output_frames"]
            ]
            variants[name] = {
                "total_seconds": payload["total_seconds"],
                "settings": payload["settings"],
                "mean_abs_rgb_average_255": sum(diffs) / len(diffs),
            }

        safe = {
            "verified": verification.get("verified"),
            "production_acceptance": verification.get("production_acceptance"),
            "human_review_required": verification.get("human_review_required"),
            "accepted_lane": verification.get("accepted_lane"),
            "checkpoints": verification.get("checkpoints"),
            "changed_counts": verification.get("changed_counts"),
            "motion_blur_shutter_source_frames": verification.get("motion_blur_shutter_source_frames"),
            "variants": variants,
            "contact_sheet": "visual-polish-contact-sheet.png",
            "coimbra_source_sha": "5a76e767d8b95578a9e999b4803176812a78b3a6",
        }
        print(json.dumps(safe, separators=(",", ":"), sort_keys=True))
        PY
        )"
        echo "result=$result" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v4
      with:
        name: coimbra-035-visual-polish-review
        path: |
          artifacts/coimbra-035/baseline/
          artifacts/coimbra-035/motion_blur/
          artifacts/coimbra-035/atmosphere_light/
          artifacts/coimbra-035/quality64/
          artifacts/coimbra-035/visual-polish-review.json
          artifacts/coimbra-035/verification.json
          artifacts/coimbra-035/visual-polish-contact-sheet.png
          artifacts/coimbra-035/image-difference-metrics.json
        if-no-files-found: error
        compression-level: 0
        retention-days: 30
